name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar noticias
        run: node scripts/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Noticias actualizadas $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)"
          git push
